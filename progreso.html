<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Progreso - NutriFit</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librería para gráficas profesionales -->
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #2d3436;
        }
        .dashboard-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }
        .btn-back {
            background: white;
            border: 2px solid #e0e0e0;
            color: #2d3436;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-back:hover { border-color: #27ae60; color: #27ae60; }
        
        .header-title {
            margin-left: 20px;
            font-size: 2rem;
            font-weight: 800;
        }
        .header-title span { color: #27ae60; }

        /* Tarjetas de Estadísticas */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #f1f2f6;
        }
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }
        .icon-fire { background: rgba(230, 126, 34, 0.1); color: #e67e22; }
        .icon-water { background: rgba(52, 152, 219, 0.1); color: #3498db; }
        .icon-apple { background: rgba(39, 174, 96, 0.1); color: #27ae60; }
        .icon-weight { background: rgba(155, 89, 182, 0.1); color: #9b59b6; }
        
        .stat-info h3 { margin: 0; font-size: 1.8rem; font-weight: 800; }
        .stat-info p { margin: 0; color: #636e72; font-size: 0.9rem; font-weight: 500; }

        /* Contenedor de la Gráfica */
        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid #f1f2f6;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .chart-header h2 { margin: 0; font-size: 1.4rem; }
        .btn-update {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Navegación -->
        <div class="top-bar">
            <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Regresar</a>
            <h1 class="header-title">Mi <span>Progreso</span></h1>
        </div>

        <!-- Tarjetas Resumen -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon icon-weight"><i class="fa-solid fa-scale-balanced"></i></div>
                <div class="stat-info">
                    <h3>-3.2 kg</h3>
                    <p>Peso perdido total</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-fire"><i class="fa-solid fa-fire"></i></div>
                <div class="stat-info">
                    <h3>12 Días</h3>
                    <p>Racha activa</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-water"><i class="fa-solid fa-droplet"></i></div>
                <div class="stat-info">
                    <h3>8/8</h3>
                    <p>Vasos hoy</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon icon-apple"><i class="fa-solid fa-apple-whole"></i></div>
                <div class="stat-info">
                    <h3>5/5</h3>
                    <p>Frutas/Verduras hoy</p>
                </div>
            </div>
        </div>

        <!-- Gráfica de Peso -->
        <div class="chart-container">
            <div class="chart-header">
                <h2>Evolución de Peso (Últimas 6 Semanas)</h2>
               <button class="btn-update" onclick="abrirModalPeso()"><i class="fa-solid fa-plus"></i> Registrar Peso</button>
            </div>
            <canvas id="pesoChart" height="100"></canvas>
        </div>
    </div>

    <!-- Script de la Gráfica (Renderizado Automático) -->
    <script>
        const ctx = document.getElementById('pesoChart').getContext('2d');
        
        // Creamos un gradiente verde para rellenar la gráfica
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(39, 174, 96, 0.4)');
        gradient.addColorStop(1, 'rgba(39, 174, 96, 0.0)');

        const pesoChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Semana 1', 'Semana 2', 'Semana 3', 'Semana 4', 'Semana 5', 'Semana 6 (Actual)'],
                datasets: [{
                    label: 'Mi Peso (kg)',
                    data: [82.5, 81.2, 80.8, 79.5, 79.8, 79.3], // Datos simulados de progreso
                    borderColor: '#27ae60',
                    backgroundColor: gradient,
                    borderWidth: 3,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#27ae60',
                    pointBorderWidth: 2,
                    pointRadius: 6,
                    pointHoverRadius: 8,
                    fill: true,
                    tension: 0.4 // Hace que la línea sea curva y suave
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        beginAtZero: false,
                        suggestedMin: 75,
                        suggestedMax: 85,
                        grid: { color: '#f1f2f6' }
                    },
                    x: { grid: { display: false } }
                }
            }
        });
    </script>

    <script>
    function abrirModalPeso() {
        Swal.fire({
            title: 'Registrar Peso de Hoy',
            text: 'Ingresa tu peso actual en kg:',
            input: 'number',
            inputAttributes: {
                step: '0.1',
                min: '30',
                max: '250'
            },
            showCancelButton: true,
            confirmButtonText: 'Guardar',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#27ae60',
            inputValidator: (value) => {
                if (!value) {
                    return '¡Debes ingresar un número válido!';
                }
            }
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({
                    icon: 'success',
                    title: '¡Peso registrado!',
                    text: `Has guardado tu registro de ${result.value} kg exitosamente.`,
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        });
    }
</script>

</body>
</html>
