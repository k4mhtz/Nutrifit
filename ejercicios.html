    function generarRutina() {
      const dias = document.getElementById("dias").value;
      const enfoqueSelect = document.getElementById("enfoque");
      const enfoque = enfoqueSelect.value;
      const enfoqueTexto = enfoqueSelect.options[enfoqueSelect.selectedIndex].text;
      
      const selectorDiasBar = document.getElementById("selector-dias");
      const contenedorDiasDetalle = document.getElementById("contenedor-dias-detalle");
      const vistaFormulario = document.getElementById("vista-formulario");
      const vistaResultado = document.getElementById("vista-resultado");
      
      document.getElementById("resumen-plan-texto").innerText = `${enfoqueTexto} - ${dias} Días`;
      
      selectorDiasBar.innerHTML = "";
      contenedorDiasDetalle.innerHTML = "";

      let explicacionTeorica = "";
      let tituloTabEnfoque = "";

      // 1. CONFIGURAMOS LA INFORMACIÓN DEL NUEVO BOTÓN
      if (enfoque === "hipertrofia") {
          tituloTabEnfoque = "Hipertrofia";
          explicacionTeorica = `
          <div class="explicacion-enfoque" style="margin-top: 0; border-left-color: #3498db;">
              <h4 style="color: #3498db;"><i class="fa-solid fa-dumbbell"></i> Entendiendo la Hipertrofia</h4>
              <p>La <strong>hipertrofia</strong> es el crecimiento del tamaño de las fibras musculares. No ocurre durante el entrenamiento, sino durante el descanso. Para que este plan funcione necesitas 3 pilares:</p>
              <ul>
                  <li><strong>Tensión Mecánica:</strong> Debes usar un peso que te cueste trabajo. Las últimas 2 repeticiones deben sentirse muy difíciles (cerca del fallo muscular).</li>
                  <li><strong>Superávit Calórico (Recomendado):</strong> Tu cuerpo necesita energía extra (comer más de lo que quemas) para construir nuevo tejido muscular.</li>
                  <li><strong>Sobrecarga Progresiva:</strong> Intenta subir el peso o sacar una repetición extra cada semana. Si haces siempre lo mismo, tu cuerpo dejará de crecer.</li>
              </ul>
          </div>`;
      } else if (enfoque === "resistencia") {
          tituloTabEnfoque = "Resistencia";
          explicacionTeorica = `
          <div class="explicacion-enfoque" style="margin-top: 0; border-left-color: #e67e22;">
              <h4 style="color: #e67e22;"><i class="fa-solid fa-fire"></i> Resistencia y Déficit Calórico</h4>
              <p>Este plan mejora tu capacidad cardiovascular y ayuda a preservar músculo mientras pierdes grasa, pero requiere entender lo siguiente:</p>
              <ul>
                  <li><strong>El Déficit Calórico es el Rey:</strong> Ninguna rutina quema grasa por sí sola si no comes menos calorías de las que gastas al día. El ejercicio es solo un complemento.</li>
                  <li><strong>Grasa Localizada (Mito):</strong> No puedes quemar grasa solo del abdomen haciendo abdominales. El déficit calórico reduce la grasa de forma global en todo el cuerpo.</li>
                  <li><strong>Densidad de Entrenamiento:</strong> Mantén los descansos cortos (30-45s) para mantener tu ritmo cardíaco elevado y maximizar el gasto energético (EPOC).</li>
              </ul>
          </div>`;
      }

      // 2. CREAMOS LA PESTAÑA LATERAL PARA LA EXPLICACIÓN
      const btnTeoria = document.createElement("button");
      btnTeoria.className = "btn-dia-tab";
      btnTeoria.id = "btn-tab-teoria";
      btnTeoria.innerHTML = `<i class="fa-solid fa-book-open" style="margin-right: 6px;"></i> ${tituloTabEnfoque}`;
      btnTeoria.onclick = () => mostrarDia('teoria');
      selectorDiasBar.appendChild(btnTeoria);

      const panelTeoria = document.createElement("div");
      panelTeoria.className = "dia-panel-detalle panel-dia-teoria";
      panelTeoria.innerHTML = explicacionTeorica;
      contenedorDiasDetalle.appendChild(panelTeoria);

      // 3. GENERAMOS LOS DÍAS DE EJERCICIO
      const rutinaSeleccionada = baseDatosCompleta[enfoque][dias];

      if (rutinaSeleccionada) {
        rutinaSeleccionada.forEach((diaInfo) => {
          const btnDia = document.createElement("button");
          btnDia.className = "btn-dia-tab";
          btnDia.id = "btn-tab-" + diaInfo.dia; // Le asignamos un ID al botón
          btnDia.innerText = "Día " + diaInfo.dia;
          btnDia.onclick = () => mostrarDia(diaInfo.dia);
          selectorDiasBar.appendChild(btnDia);

          const diaPanel = document.createElement("div");
          diaPanel.className = "dia-panel-detalle panel-dia-" + diaInfo.dia;

          let htmlContenido = `
            <div class='info-enfoque-dia'>${diaInfo.enfoque}</div>
            <div class='ejercicios-grid-container'>
          `;
          
          diaInfo.ejercicios.forEach((ejercicio, ejIndex) => {
            let nombreEj = ejercicio.nombre || "Ejercicio";
            let descEj = ejercicio.descripcion || "Recuerda mantener una buena postura.";
            let imgEj = ejercicio.imagen || "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=600"; 
            let cardId = `card-ej-${diaInfo.dia}-${ejIndex}`;
            
            let safeNombre = nombreEj.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            let safeDesc = descEj.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            let safeImg = imgEj.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            
            htmlContenido += `
              <div class="ejercicio-card-moderna" id="${cardId}">
                <div class="ejercicio-info">
                  <h4 style="cursor: pointer;" onclick="mostrarExplicacion('${safeNombre}', '${safeDesc}', '${safeImg}')">
                      ${nombreEj} <i class="fa-solid fa-circle-info" title="Ver técnica detallada"></i>
                  </h4>
                </div>
                <div class="metricas-badge">
                  <span>Series: <span class="valor">${ejercicio.sets}</span></span>
                  <span>Reps: <span class="valor">${ejercicio.reps}</span></span>
                </div>
                <div class="descanso-texto">
                  <i class="fa-regular fa-clock"></i> ${ejercicio.descanso} de descanso
                </div>
                <button class="btn-completar-ej" onclick="marcarEjercicioCompletado(this, '${cardId}')">
                    <i class="fa-regular fa-square"></i> Marcar como completado
                </button>
              </div>
            `;
          });

          htmlContenido += `</div>`; 
          diaPanel.innerHTML = htmlContenido;
          contenedorDiasDetalle.appendChild(diaPanel);
        });

        vistaFormulario.classList.remove("vista-activa");
        vistaFormulario.classList.add("vista-oculta");
        vistaResultado.classList.remove("vista-oculta");
        vistaResultado.classList.add("vista-activa");
        
        // 4. AL GENERARSE, MOSTRAMOS LA TEORÍA POR DEFECTO
        mostrarDia('teoria'); 
      }
    }

    // MODIFICAMOS MOSTRAR DÍA PARA QUE RECONOZCA LOS IDs
    function mostrarDia(diaNumero) {
      const botones = document.querySelectorAll('.btn-dia-tab');
      const paneles = document.querySelectorAll('.dia-panel-detalle');
      
      botones.forEach(btn => btn.classList.remove('activo'));
      paneles.forEach(panel => panel.classList.remove('activo'));

      const btnActivo = document.getElementById("btn-tab-" + diaNumero);
      if (btnActivo) btnActivo.classList.add('activo');

      const panelActivo = document.querySelector(".panel-dia-" + diaNumero);
      if (panelActivo) panelActivo.classList.add('activo');
    }

    function mostrarExplicacion(nombre, descripcion, imagen) {
      Swal.fire({
        title: nombre,
        html: descripcion,
        imageUrl: imagen,            
        imageWidth: 400,             
        imageHeight: 220,            
        imageAlt: 'Demostración del ejercicio',
        confirmButtonText: 'Entendido',
        confirmButtonColor: '#27ae60',
        customClass: {
            image: 'swal-ejercicio-img'
        }
      });
    }

    function marcarEjercicioCompletado(btn, cardId) {
        const card = document.getElementById(cardId);
        card.classList.toggle('ejercicio-completado');
        
        if (card.classList.contains('ejercicio-completado')) {
            btn.innerHTML = '<i class="fa-solid fa-check-square"></i> ¡Completado!';
            btn.classList.add('completado-activo');
        } else {
            btn.innerHTML = '<i class="fa-regular fa-square"></i> Marcar como completado';
            btn.classList.remove('completado-activo');
        }
    }
</script>
