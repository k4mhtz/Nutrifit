        nueva(34, 'Palomitas con Chile y Limón', 100, 3, 18, 2,
            ['3 tazas de palomitas naturales', 'Jugo de 1/2 limón', 'Chile en polvo', 'Sal'],

        nueva(35, 'Barritas Proteicas de Avena', 145, 11, 21, 2,
            ['80 g de avena', '30 g de proteína en polvo', '2 claras de huevo', '1 plátano maduro', 'Canela'],
            ['Precalienta el horno a 180°C', 'Mezcla todos los ingredientes con el plátano machacado', 'Hornea en un molde 15-18 minutos', 'Enfría y corta en 4 barritas (los valores son por barrita)']);
        nueva(36, 'Huevos Cocidos con Pepino', 160, 13, 4, 10,
            ['2 huevos', '1/2 pepino en rodajas', 'Sal, pimienta y limón'],
            ['Hierve los huevos 10 minutos', 'Enfríalos y pélalos', 'Sirve con el pepino y sazona']);
        nueva(37, 'Rollitos de Pavo y Queso', 155, 20, 3, 7,
            ['4 rebanadas de pechuga de pavo', '2 rebanadas de queso panela', 'Tiras de pepino', 'Mostaza (opcional)'],

        // IMAGEN DE RESPALDO (para recetas sin foto o si la foto no carga)
        const imgRespaldo = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#d5f5e3"/><text x="100" y="130" font-size="90" text-anchor="middle">🍽️</text></svg>');

        // OBTENER ID DE LA RECETA DESDE LA URL
        const params = new URLSearchParams(window.location.search);
        const recetaId = parseInt(params.get('id')) || 0;

        const receta = recetas[recetaId];

        if (receta) {
            // LLENAR LA PÁGINA CON LOS DATOS
            const imgEl = document.getElementById('recetaImg');
            imgEl.onerror = () => { imgEl.onerror = null; imgEl.src = imgRespaldo; };
            imgEl.src = receta.imagen || imgRespaldo;
            document.getElementById('recetaTitulo').textContent = receta.titulo;
            document.getElementById('recetaStats').textContent = receta.stats;

            // INGREDIENTES
            const ingredientesHtml = receta.ingredientes.map(ing => `
                <li style="padding: 12px 0; border-bottom: 1px solid #eee; color: #636e72; font-size: 1rem;">
                    <span style="color: #27ae60; font-weight: bold; margin-right: 10px;">✓</span> ${ing}
                </li>
            `).join('');
            document.getElementById('recetaIngredientes').innerHTML = ingredientesHtml;

            // PASOS
            const pasosHtml = receta.pasos.map((paso, idx) => `
                <li style="padding: 15px 0; color: #636e72; font-size: 1rem; line-height: 1.6;">
                    <strong style="color: #27ae60;">Paso ${idx + 1}:</strong> ${paso}
                </li>
            `).join('');
            document.getElementById('recetaPasos').innerHTML = pasosHtml;

            // NUTRICIÓN
            const nutricionHtml = `
                <div style="background: linear-gradient(135deg, #27ae60, #229954); color: white; padding: 20px; border-radius: 10px; text-align: center;">

                    <div style="font-size: 1.8rem; font-weight: bold;">${receta.nutricion.calorias}</div>
                </div>
                <div style="background: linear-gradient(135deg, #3498db, #2980b9); color: white; padding: 20px; border-radius: 10px; text-align: center;">

                    <div style="font-size: 1.8rem; font-weight: bold;">${receta.nutricion.proteina}</div>
                </div>
                <div style="background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; padding: 20px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 0.9rem; opacity: 0.9;">Carbos</div>
                    <div style="font-size: 1.8rem; font-weight: bold;">${receta.nutricion.carbos}</div>
                </div>
                <div style="background: linear-gradient(135deg, #f39c12, #e67e22); color: white; padding: 20px; border-radius: 10px; text-align: center;">
                    <div style="font-size: 0.9rem; opacity: 0.9;">Grasas</div>
                    <div style="font-size: 1.8rem; font-weight: bold;">${receta.nutricion.grasas}</div>
                </div>
            `;
            document.getElementById('recetaNutricion').innerHTML = nutricionHtml;
        }
    </script>
